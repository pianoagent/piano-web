name: Deploy piano.cz

on:
  push:
    branches: [main]
    paths:
      - 'apps/piano/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-piano.yml'
  workflow_dispatch:

concurrency:
  group: deploy-piano
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Diagnostika: veřejná IP runneru pro Webglobe (rozbitý IP filtr blokuje FTP).
      # GitHub-hosted runnery mají dynamickou IP z Azure poolu, mění se běh od běhu.
      - name: Veřejná IP runneru
        run: |
          echo "IPv4: $(curl -s --max-time 10 https://api.ipify.org || echo '?')"
          echo "IPv6: $(curl -s --max-time 10 https://api64.ipify.org || echo '?')"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # After npm ci, which wipes node_modules. Without it every build regenerates all AVIF/WebP variants.
      - name: Cache optimalizovaných obrázků
        uses: actions/cache@v6
        with:
          path: apps/piano/node_modules/.astro/assets
          key: astro-assets-piano-${{ hashFiles('apps/piano/src/assets/**', 'packages/ui/lib/images.ts') }}
          restore-keys: astro-assets-piano-

      - name: Typová kontrola (astro check)
        working-directory: apps/piano
        run: npx astro check

      - name: Build piano.cz
        run: npm run build:piano

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: apps/piano/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # _headers je jen pro Cloudflare Pages, na tomhle hostingu nedává smysl
          exclude: |
            _headers
            **/.DS_Store
