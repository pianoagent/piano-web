name: Deploy savarin.cz

on:
  push:
    branches: [main]
    paths:
      - 'apps/savarin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-savarin.yml'
  workflow_dispatch:

concurrency:
  group: deploy-savarin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # After npm ci, which wipes node_modules. Without it every build regenerates all AVIF/WebP variants.
      - name: Cache optimalizovaných obrázků
        uses: actions/cache@v6
        with:
          path: apps/savarin/node_modules/.astro/assets
          key: astro-assets-savarin-${{ hashFiles('apps/savarin/src/assets/**', 'packages/ui/lib/images.ts') }}
          restore-keys: astro-assets-savarin-

      - name: Typová kontrola (astro check)
        working-directory: apps/savarin
        run: npx astro check

      - name: Build savarin.cz
        run: npm run build:savarin

      # Bez GTM web nesmí jít live (scripts/check-gtm.mjs)
      - name: Kontrola měření (GTM)
        run: node scripts/check-gtm.mjs apps/savarin/dist

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SAVARIN_FTP_SERVER }}
          username: ${{ secrets.SAVARIN_FTP_USERNAME }}
          password: ${{ secrets.SAVARIN_FTP_PASSWORD }}
          protocol: ${{ vars.SAVARIN_FTP_PROTOCOL || 'ftp' }}
          local-dir: apps/savarin/dist/
          server-dir: ${{ vars.SAVARIN_FTP_SERVER_DIR || './' }}
          # Cloudflare artefakty (worker/headers/routes) na tomhle hostingu nedávají smysl
          exclude: |
            _worker.js/**
            _routes.json
            _headers
            _redirects
            **/.DS_Store
