name: Deploy pecosta.cz

on:
  push:
    branches: [main]
    paths:
      - 'apps/pecosta/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pecosta.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pecosta
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pecosta.cz
        run: npm run build:pecosta

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PECOSTA_FTP_SERVER }}
          username: ${{ secrets.PECOSTA_FTP_USERNAME }}
          password: ${{ secrets.PECOSTA_FTP_PASSWORD }}
          protocol: ${{ vars.PECOSTA_FTP_PROTOCOL || 'ftp' }}
          local-dir: apps/pecosta/dist/
          server-dir: ${{ vars.PECOSTA_FTP_SERVER_DIR || './' }}
          # Cloudflare artefakty (worker/headers/routes) na tomhle hostingu nedávají smysl
          exclude: |
            _worker.js/**
            _routes.json
            _headers
            **/.DS_Store
